name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install --require-hashes -r requirements.lock
          pip install -e ".[dev]" --no-deps
          pip install "bandit>=1.8" "mypy>=1.13" "pip-audit>=2.7" "pytest>=8.3" "pytest-asyncio>=0.24" "pytest-cov>=6" "ruff>=0.8"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest --cov=moviexfone.api --cov=moviexfone.voice --cov-fail-under=65
      - name: Bandit
        run: bandit -r src -ll
      - name: pip-audit
        run: pip-audit -r requirements.lock
      - name: Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose --redact
