# Hashed build backend. Same setuptools pin as requirements-dev.lock.
# Install this before building the project, then pass --no-build-isolation.
# PEP 517 isolation ignores --require-hashes on the project install and would
# download whatever setuptools release matches pyproject.toml.
# wheel is not required: setuptools.build_meta writes the wheel itself, and
# wheel 0.48 pulls an extra packaging dependency into the image build.

